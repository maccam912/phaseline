name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phaseline-release-${{ github.ref }}
  queue: max

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Stamp the project and native version metadata
        id: version
        run: python3 .github/scripts/version.py
      - name: Check LFS media and all song charts
        run: |
          git lfs fsck
          python3 tools/music/check_charts.py
      - name: Install the official Godot 4.7.2 editor and desktop templates
        working-directory: ${{ runner.temp }}
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          editor=Godot_v4.7.2-stable_linux.x86_64.zip
          templates=Godot_v4.7.2-stable_export_templates.tpz
          curl --fail --location --retry 4 --retry-all-errors --output "$editor" "$base/$editor"
          curl --fail --location --retry 4 --retry-all-errors --output "$templates" "$base/$templates"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $editor" | sha256sum --check
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $templates" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -q "$editor" -d "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/bin/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/bin/godot"
          chmod +x "$RUNNER_TEMP/bin/godot"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          install_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$install_dir"
          unzip -qj "$templates" 'templates/linux_*.x86_64' 'templates/windows_*_x86_64*.exe' \
            templates/macos.zip templates/icudt_godot.dat templates/version.txt -d "$install_dir"
      - name: Import resources and export all three packages
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/packages"
          mkdir -p "$out/windows" "$out/linux" "$out/macos" "$RUNNER_TEMP/release"
          godot --headless --editor --import --path .
          godot --headless --path . --export-release macOS "$out/macos/Phaseline.zip"
          godot --headless --path . --export-release Windows "$out/windows/Phaseline.exe"
          godot --headless --path . --export-release Linux "$out/linux/Phaseline.x86_64"
          mv "$out/macos/Phaseline.zip" "$RUNNER_TEMP/release/Phaseline-macOS-universal.zip"
          (cd "$out/windows" && zip -qr "$RUNNER_TEMP/release/Phaseline-Windows-x86_64.zip" .)
          (cd "$out/linux" && zip -qr "$RUNNER_TEMP/release/Phaseline-Linux-x86_64.zip" .)
          cd "$RUNNER_TEMP/release"
          sha256sum -- *.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-release
          path: ${{ runner.temp }}/release
      - name: Start the packaged game on its target OS
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: python .github/scripts/smoke.py

  publish:
    needs: [build, smoke]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-release
          path: ${{ runner.temp }}/release
      - name: Verify archives and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: python3 .github/scripts/publish.py
